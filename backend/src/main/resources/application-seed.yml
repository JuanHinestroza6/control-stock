# Perfil del generador de datos de demostración (ADR-008). Úsalo junto con dev: -Dspring-boot.run.profiles=dev,seed
spring:
  main:
    web-application-type: none # sin servidor HTTP durante la carga (el RelojSimulado no debe servir peticiones)
app:
  tareas:
    habilitadas: false
  alertas:
    por-evento: false # las alertas se evalúan al final de la carga, no una por movimiento
  semilla:
    ejecutar: true
    salir-al-terminar: true
    semilla-aleatoria: 42
    meses: 36
    fecha-fin: # vacía = ayer (America/Bogota); debe ser anterior a hoy
    tickets-dia-base: 15 # calibrado: unas 18 mil ventas en 36 meses
    password: ${SEED_PASSWORD:} # obligatoria; misma política que las contraseñas (12-72 caracteres)
