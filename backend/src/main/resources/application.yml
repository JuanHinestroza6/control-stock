spring:
  application:
    name: control-stock
  config:
    # .env vive en la raiz del repo; el backend se ejecuta desde backend/. Si no existe, se usan las variables de entorno reales.
    import: "optional:file:../.env[.properties]"
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/control_stock}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate # el esquema lo controla Flyway
    properties:
      hibernate:
        jdbc:
          time_zone: America/Bogota
        # Actualiza filas en orden de PK: evita deadlocks entre ventas de varias líneas (ADR-006)
        order_updates: true
        query:
          # El kardex es inmutable: un UPDATE/DELETE masivo sobre una entidad @Immutable falla en vez de ignorarse
          immutable_entity_update_query_handling_mode: exception
  flyway:
    enabled: true
    locations: classpath:db/migration
    placeholders:
      # Solo los usa V2 (ADMIN inicial) y unicamente si no existe ningun ADMIN
      admin-email: ${ADMIN_EMAIL:}
      admin-password: ${ADMIN_PASSWORD:}
  jackson:
    time-zone: America/Bogota

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET:} # minimo 32 bytes (HS256); la app no arranca si es mas corto
    expiracion: ${JWT_EXPIRACION:8h}
  cors:
    origenes: ${CORS_ORIGENES:http://localhost:5173}
  login:
    # Limitador en memoria de intentos fallidos (clave = email + IP)
    max-intentos: ${LOGIN_MAX_INTENTOS:5}
    ventana: ${LOGIN_VENTANA:15m}
  tareas:
    # false apaga @Scheduled (pruebas y generador de datos semilla)
    habilitadas: ${TAREAS_HABILITADAS:true}
  reservas:
    vigencia-horas: 48 # vigencia por defecto de un apartado (1 a 168)
    vencimiento:
      intervalo: PT15M # cada cuánto se vencen las reservas ACTIVAS pasadas de fecha
    anonimizacion: # Ley 1581: supresión de datos del cliente de reservas cerradas
      cron: "0 30 2 * * *" # 02:30 America/Bogota
      dias: 90 # retención tras cerrar la reserva
